name: Generar PDF del reporte Markdown

on:
  push:
    paths-ignore:
      - "**/*.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convertir:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio.
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Buscar el único Markdown entregable. README.md no se considera reporte.
      - name: Buscar archivo Markdown
        id: reporte
        shell: bash
        run: |
          mapfile -d '' archivos < <(
            find . -type f -name '*.md' \
              ! -name 'README.md' \
              ! -path './.git/*' \
              -print0
          )

          if [ "${#archivos[@]}" -eq 0 ]; then
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "No existe un archivo Markdown entregable."
            exit 0
          fi

          if [ "${#archivos[@]}" -gt 1 ]; then
            echo "Se encontró más de un archivo Markdown entregable:"
            printf ' - %s\n' "${archivos[@]}"
            exit 1
          fi

          markdown="${archivos[0]#./}"
          pdf="${markdown%.md}.pdf"

          echo "existe=true" >> "$GITHUB_OUTPUT"
          echo "markdown=$markdown" >> "$GITHUB_OUTPUT"
          echo "pdf=$pdf" >> "$GITHUB_OUTPUT"
          echo "Se convertirá $markdown en $pdf"

      # 3. Instalar Pandoc y LaTeX solamente cuando exista el reporte.
      - name: Instalar dependencias
        if: steps.reporte.outputs.existe == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-plain-generic

      # 4. Convertir el Markdown a un PDF con el mismo nombre.
      - name: Convertir Markdown a PDF
        if: steps.reporte.outputs.existe == 'true'
        env:
          MARKDOWN: ${{ steps.reporte.outputs.markdown }}
          PDF: ${{ steps.reporte.outputs.pdf }}
        run: |
          echo "Convirtiendo $MARKDOWN en $PDF..."
          pandoc "$MARKDOWN" \
            --from=gfm \
            --standalone \
            --pdf-engine=xelatex \
            --resource-path=".:$(dirname "$MARKDOWN")" \
            --output="$PDF"

      # 5. Guardar el PDF generado en el repositorio.
      - name: Commit y push
        if: steps.reporte.outputs.existe == 'true'
        env:
          PDF: ${{ steps.reporte.outputs.pdf }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PDF"

          if git diff --cached --quiet; then
            echo "El PDF no cambió; no se creará un commit."
            exit 0
          fi

          git commit -m "Generar PDF del reporte Markdown"
          git push
