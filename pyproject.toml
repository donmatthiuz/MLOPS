[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gasolina-gt"
version = "0.1.0"
description = "Extracción, pronóstico y recomendación de precios de combustible en Guatemala"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "joblib>=1.3", "numpy>=1.26", "opencv-python-headless>=4.9",
  "pandas>=2.1", "pillow>=10", "pillow-heif>=0.16", "PyYAML>=6", "requests>=2.31",
  "scikit-learn>=1.4", "uvicorn>=0.27", "xgboost>=2.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
gasolina-gt = "gasolina_gt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
